<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PulseAPI Docs</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }

    #chat-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #4A5DFF;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    #chat-window {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 320px;
      height: 420px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-header {
      background: #4A5DFF;
      color: white;
      padding: 12px;
      font-weight: bold;
    }

    #chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }

    .msg { margin-bottom: 10px; }
    .msg.user { text-align: right; color: #4A5DFF; }
    .msg.bot { text-align: left; color: #333; }

    #chat-input-area {
      display: flex;
      border-top: 1px solid #eee;
    }

    #chat-input {
      flex: 1;
      border: none;
      padding: 10px;
      font-size: 14px;
    }

    #chat-send {
      border: none;
      background: #4A5DFF;
      color: white;
      padding: 0 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Welcome to the PulseAPI website</h1>
  <p>This is a placeholder page to demonstrate the chat widget.</p>

  <div id="chat-icon" onclick="toggleChat()">💬</div>

  <div id="chat-window">
    <div id="chat-header">PulseAPI Docs Assistant</div>
    <div id="chat-messages"></div>
    <div id="chat-input-area">
      <input id="chat-input" type="text" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button id="chat-send" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
  <script>
    const threadId = "widget-session-" + Math.random().toString(36).substring(2);

    function toggleChat() {
      const win = document.getElementById("chat-window");
      win.style.display = (win.style.display === "flex") ? "none" : "flex";
    }

    function addMessage(text, sender) {
      const messages = document.getElementById("chat-messages");
      const div = document.createElement("div");
      div.className = "msg " + sender;

      if (sender === "bot") {
        div.innerHTML = marked.parse(text);
      } else {
        div.textContent = text;
      }

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("chat-input");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      const response = await fetch("http://127.0.0.1:8000/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, thread_id: threadId })
      });

      const data = await response.json();
      addMessage(data.reply, "bot");
    }
  </script>

</body>
</html>
